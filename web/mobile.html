<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0B0B0C">
  <title>Research Helper</title>
  <link rel="icon" href="/extension/icons/48.png">
  <style>
    @font-face { font-family: 'Inter Tight'; src: url('/extension/vendor/inter-tight.woff2') format('woff2'); font-weight: 100 900; }
    :root { --bg: #0B0B0C; --line: #2C2C30; --mut: #A9A6A2; --dim: #6E6B68; --text: #F5F3F0; }
    html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; -webkit-tap-highlight-color: transparent; }
    .stage { position: fixed; inset: 0 0 calc(56px + env(safe-area-inset-bottom)) 0; }
    .stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: var(--bg); visibility: hidden; }
    body[data-tab="read"] #viewer, body[data-tab="learn"] #panel { visibility: visible; }
    nav { position: fixed; left: 0; right: 0; bottom: 0; height: 56px; padding-bottom: env(safe-area-inset-bottom); display: flex; background: var(--bg); border-top: 1px solid var(--line); }
    nav button { flex: 1; background: none; border: 0; color: var(--dim); font: 600 12px/1 'Inter Tight', system-ui, sans-serif; letter-spacing: .12em; text-transform: uppercase; position: relative; }
    nav button svg { display: block; margin: 0 auto 6px; width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.6; }
    nav button.on { color: var(--text); }
    nav button.on::after { content: ''; position: absolute; top: -1px; left: 30%; right: 30%; height: 2px; background: linear-gradient(90deg, #FF4D5E, #FFC93C); }
    nav button .dot { position: absolute; top: 10px; left: calc(50% + 8px); width: 6px; height: 6px; border-radius: 50%; background: #FFC93C; display: none; }
    nav button.ping .dot { display: block; }
    #error { position: fixed; left: 16px; right: 16px; top: 16px; background: #1A0E11; color: #FF8A9A; font: 13px system-ui, sans-serif; padding: 10px 14px; z-index: 9; }
  </style>
</head>
<body data-tab="learn">
  <div class="stage">
    <iframe id="viewer" title="PDF"></iframe>
    <iframe id="panel" title="Explainer"></iframe>
  </div>
  <nav>
    <button data-go="read"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4M9 12h7M9 16h7"/></svg>Paper<span class="dot"></span></button>
    <button data-go="learn" class="on"><svg viewBox="0 0 24 24"><path d="M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z"/></svg>Learn<span class="dot"></span></button>
  </nav>
  <div id="error" hidden></div>
  <script type="module" src="/web/app.js"></script>
</body>
</html>
